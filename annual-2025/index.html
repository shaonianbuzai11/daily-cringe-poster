<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>我的 2025 年度总结</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#f6f1e5; color:#1a1a1a;
    display:flex; justify-content:center;
    min-height:100vh;
  }
  #app { width:100%; max-width:480px; min-height:100vh; position:relative; overflow:hidden; background:#f6f1e5; }
  @media (min-width:520px){
    body{ padding:24px 0; }
    #app{ border-radius:28px; box-shadow:0 20px 60px rgba(0,0,0,.15); min-height:calc(100vh - 48px); }
  }
  .screen{ display:none; padding:20px 20px 40px; animation:fadeUp .45s ease both; }
  .screen.active{ display:block; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }

  /* 顶部朋友圈式栏 */
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:6px 4px 14px; }
  .topbar .t{ font-size:15px; font-weight:600; color:#1a1a1a; }
  .avatar{ width:38px; height:38px; border-radius:50%; background:#1a1a1a; color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; }

  /* 封面 */
  .cover-title{ font-size:54px; font-weight:900; letter-spacing:2px; transform:rotate(-2deg);
    margin:6px 0 4px 2px; text-shadow:3px 3px 0 rgba(232,98,44,.18); }
  .cover-sub{ font-size:15px; color:#6b6257; margin:10px 0 18px 4px; }
  .illus-wrap{ position:relative; margin:0 -4px; }
  .illus{ width:100%; border-radius:20px; display:block; box-shadow:0 12px 32px rgba(120,70,20,.22); }
  .float-emoji{ position:absolute; font-size:30px; animation:floaty 3.2s ease-in-out infinite; filter:drop-shadow(0 4px 6px rgba(0,0,0,.2)); }
  .fe1{ top:-14px; left:8%; animation-delay:0s; }
  .fe2{ top:6%; right:6%; animation-delay:1s; font-size:26px; }
  .fe3{ bottom:-12px; right:14%; animation-delay:2s; }
  @keyframes floaty{ 0%,100%{ transform:translateY(0) rotate(-6deg);} 50%{ transform:translateY(-12px) rotate(8deg);} }
  .cta{ display:block; width:100%; margin:26px 0 10px; padding:17px; border:none; border-radius:999px;
    background:#1a1a1a; color:#fff; font-size:18px; font-weight:700; letter-spacing:2px; cursor:pointer; }
  .cta:active{ transform:scale(.98); }
  .tiny{ text-align:center; font-size:12px; color:#a39a8b; margin-top:6px; }

  /* 答题 */
  .progress{ height:6px; background:#e7ddc8; border-radius:99px; overflow:hidden; margin:8px 0 22px; }
  .progress i{ display:block; height:100%; width:0; background:linear-gradient(90deg,#f0a04b,#e8622c);
    border-radius:99px; transition:width .35s ease; }
  .q-index{ font-size:13px; color:#a39a8b; font-weight:600; letter-spacing:1px; margin-bottom:8px; }
  .q-title{ font-size:22px; font-weight:800; line-height:1.5; margin-bottom:20px; }
  .opt{ display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:#fffdf7; border:2px solid #eee4cf; border-radius:16px; padding:15px 16px;
    font-size:16px; font-weight:600; color:#1a1a1a; margin-bottom:12px; cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, background .12s ease; }
  .opt .e{ font-size:24px; }
  .opt:active{ transform:scale(.98); }
  .opt.picked{ border-color:#1a1a1a; background:#fff3df; }

  /* 名字 */
  .name-title{ font-size:24px; font-weight:800; margin:26px 0 8px; line-height:1.5; }
  .name-sub{ font-size:14px; color:#6b6257; margin-bottom:20px; }
  .name-input{ width:100%; padding:16px; font-size:18px; border:2px solid #eee4cf; border-radius:16px;
    background:#fffdf7; outline:none; text-align:center; font-weight:700; letter-spacing:2px; }
  .name-input:focus{ border-color:#1a1a1a; }
  .skip{ display:block; margin:14px auto 0; background:none; border:none; color:#a39a8b; font-size:14px; cursor:pointer; }

  /* 结果卡 */
  #result-card{ background:#fffdf7; border-radius:22px; padding:22px 20px; box-shadow:0 14px 40px rgba(120,70,20,.18); }
  .rc-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .rc-top .t{ font-size:15px; font-weight:700; }
  .rc-top .y{ font-size:13px; color:#a39a8b; font-weight:600; }
  .rc-keyword{ text-align:center; font-size:44px; font-weight:900; letter-spacing:4px; margin:8px 0 4px;
    background:linear-gradient(180deg,#e8622c,#f0a04b); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .rc-tag{ text-align:center; margin-bottom:14px; }
  .rc-tag span{ display:inline-block; background:#1a1a1a; color:#fff; font-size:13px; font-weight:700;
    padding:6px 16px; border-radius:999px; letter-spacing:1px; }
  .rc-summary{ font-size:15px; line-height:2; color:#3a352d; background:#faf5e9; border-radius:14px;
    padding:14px 16px; margin-bottom:16px; }
  .stat{ margin-bottom:12px; }
  .stat .row{ display:flex; justify-content:space-between; font-size:14px; font-weight:700; margin-bottom:6px; }
  .stat .bar{ height:10px; background:#f0e8d5; border-radius:99px; overflow:hidden; }
  .stat .bar i{ display:block; height:100%; width:0; border-radius:99px;
    background:linear-gradient(90deg,#f0a04b,#e8622c); transition:width 1s ease .3s; }
  .rc-fun{ margin:16px 0; background:#fff3df; border:1.5px dashed #e8a04b; border-radius:14px;
    padding:12px 14px; font-size:14px; font-weight:600; color:#7a4a12; text-align:center; line-height:1.8; }
  .rc-illus{ width:100%; border-radius:16px; display:block; margin:4px 0 16px; }
  .rc-qr{ display:flex; align-items:center; justify-content:center; gap:14px; padding-top:6px;
    border-top:1px solid #f0e8d5; padding-top:16px; }
  #qr-box{ width:104px; height:104px; background:#fff; padding:4px; border:1px solid #eee; border-radius:8px;
    display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #qr-box img{ width:100%; height:100%; display:block; }
  .rc-qr .txt{ font-size:14px; font-weight:700; line-height:1.9; }
  .rc-qr .link{ font-size:11px; color:#a39a8b; font-weight:400; word-break:break-all; max-width:180px; }

  .btn-row{ display:flex; gap:12px; margin-top:20px; }
  .btn{ flex:1; padding:15px; border-radius:999px; font-size:16px; font-weight:700; cursor:pointer; border:none; }
  .btn.dark{ background:#1a1a1a; color:#fff; }
  .btn.light{ background:#fffdf7; color:#1a1a1a; border:2px solid #1a1a1a; }
  .btn:active{ transform:scale(.97); }

  /* 保存浮层 */
  #save-overlay{ position:fixed; inset:0; background:rgba(20,14,8,.85); z-index:50; display:none;
    flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  #save-overlay.show{ display:flex; }
  #save-overlay img{ max-width:100%; max-height:72vh; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  #save-overlay .hint{ color:#fff; font-size:15px; font-weight:600; margin:16px 0; }
  #save-overlay .close{ background:#fff; border:none; border-radius:999px; padding:12px 40px;
    font-size:15px; font-weight:700; cursor:pointer; }

  #confetti{ position:fixed; inset:0; pointer-events:none; z-index:40; }
  #toast{ position:fixed; left:50%; bottom:60px; transform:translateX(-50%); background:rgba(26,26,26,.92);
    color:#fff; font-size:14px; padding:12px 22px; border-radius:999px; display:none; z-index:60; white-space:nowrap; }
</style>
</head>
<body>
<div id="app">

  <!-- 封面 -->
  <section class="screen active" id="screen-cover">
    <div class="topbar">
      <div class="t">我的 2025 年度总结</div>
      <div class="avatar">我</div>
    </div>
    <h1 class="cover-title">年度总结！</h1>
    <p class="cover-sub">5 道题，测测你的 2025 到底是哪一款 🎲</p>
    <div class="illus-wrap">
      <img class="illus" src="assets/bonfire.webp" alt="黄昏篝火">
      <span class="float-emoji fe1">🍊</span>
      <span class="float-emoji fe2">⭐</span>
      <span class="float-emoji fe3">⛺</span>
    </div>
    <button class="cta" onclick="startQuiz()">开始测试 →</button>
    <p class="tiny">约 1 分钟 · 仅供娱乐，开心最重要</p>
  </section>

  <!-- 答题 -->
  <section class="screen" id="screen-quiz">
    <div class="topbar">
      <div class="t">我的 2025 年度总结</div>
      <div class="avatar">我</div>
    </div>
    <div class="progress"><i id="pbar"></i></div>
    <div class="q-index" id="q-index">第 1 / 5 题</div>
    <h2 class="q-title" id="q-title"></h2>
    <div id="opts"></div>
  </section>

  <!-- 名字 -->
  <section class="screen" id="screen-name">
    <div class="topbar">
      <div class="t">我的 2025 年度总结</div>
      <div class="avatar">我</div>
    </div>
    <h2 class="name-title">最后一步<br>给你的 2025 留个名字 ✍️</h2>
    <p class="name-sub">会出现在你的年度总结海报上</p>
    <input class="name-input" id="name-input" maxlength="8" placeholder="比如：阿茶">
    <button class="cta" onclick="genResult()">生成我的年度总结 ✨</button>
    <button class="skip" onclick="genResult(true)">跳过，直接生成</button>
  </section>

  <!-- 结果 -->
  <section class="screen" id="screen-result">
    <div id="result-card">
      <div class="rc-top">
        <div class="t" id="rc-title">我的 2025 年度总结</div>
        <div class="y">2025 · 年度报告</div>
      </div>
      <div class="rc-keyword" id="rc-keyword">「热辣滚烫」</div>
      <div class="rc-tag"><span id="rc-tag">2025 年度 · 人间值得</span></div>
      <p class="rc-summary" id="rc-summary"></p>
      <div class="stat">
        <div class="row"><span>🔥 奋斗值</span><span id="v0">0</span></div>
        <div class="bar"><i id="b0"></i></div>
      </div>
      <div class="stat">
        <div class="row"><span>🎈 快乐值</span><span id="v1">0</span></div>
        <div class="bar"><i id="b1"></i></div>
      </div>
      <div class="stat">
        <div class="row"><span>🍃 松弛感</span><span id="v2">0</span></div>
        <div class="bar"><i id="b2"></i></div>
      </div>
      <div class="rc-fun" id="rc-fun"></div>
      <img class="rc-illus" src="assets/bonfire.webp" alt="黄昏篝火">
      <div class="rc-qr">
        <div id="qr-box"></div>
        <div class="txt">扫码获取<br>「我的年度总结」<div class="link" id="qr-link"></div></div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn dark" onclick="savePoster()">保存海报</button>
      <button class="btn light" onclick="restart()">再测一次</button>
    </div>
    <p class="tiny">本测试仅供娱乐 · 结果由你的选择生成</p>
  </section>

</div>

<canvas id="confetti"></canvas>

<div id="save-overlay" onclick="if(event.target===this)closeSave()">
  <img id="save-img" alt="年度总结海报">
  <div class="hint">长按图片保存到相册，分享给朋友吧 📤</div>
  <button class="close" onclick="closeSave()">关闭</button>
</div>
<div id="toast"></div>

<script src="assets/qrcode-generator.min.js"></script>
<script src="assets/html2canvas.min.js"></script>
<script>
/* ============ 题库 ============ */
const QUESTIONS = [
  { q:"如果用一种味道形容你的 2025，会是？", opts:[
    {e:"🍊", t:"酸酸甜甜，先苦后甜", type:"lifer"},
    {e:"🔥", t:"热气腾腾，干劲十足", type:"fighter"},
    {e:"🍵", t:"清清淡淡，回味悠长", type:"balancer"},
    {e:"🎢", t:"忽上忽下，刺激拉满", type:"dreamer"} ]},
  { q:"2025 年，你把最多的时间给了谁？", opts:[
    {e:"💼", t:"工作和搞钱", type:"fighter"},
    {e:"🎮", t:"吃喝玩乐和朋友", type:"lifer"},
    {e:"📚", t:"学习、充电和热爱", type:"dreamer"},
    {e:"⚖️", t:"工作生活两不误", type:"balancer"} ]},
  { q:"今年哪个瞬间让你觉得“值了”？", opts:[
    {e:"🏆", t:"拿下了一个重要目标", type:"fighter"},
    {e:"🎉", t:"和朋友的一次狂欢", type:"lifer"},
    {e:"💡", t:"冒出了一个大胆的想法", type:"dreamer"},
    {e:"🛋️", t:"彻底放空的一整天", type:"balancer"} ]},
  { q:"深夜 emo 时，你的脑子里在想？", opts:[
    {e:"📈", t:"明年到底怎么搞钱", type:"fighter"},
    {e:"🍜", t:"明天去吃点啥好的", type:"lifer"},
    {e:"🌌", t:"人生的意义到底是啥", type:"dreamer"},
    {e:"😴", t:"天塌下来先睡觉", type:"balancer"} ]},
  { q:"2026 年，你最想实现的是？", opts:[
    {e:"🚀", t:"升职加薪，事业起飞", type:"fighter"},
    {e:"✈️", t:"去更多地方，吃更多好吃的", type:"lifer"},
    {e:"🎨", t:"把热爱变成事业", type:"dreamer"},
    {e:"🧘", t:"工作生活都稳稳的", type:"balancer"} ]},
];

const ARCHETYPES = {
  fighter:{ keyword:"火力全开", tag:"2025 年度 · 拼命三郎",
    summary:"{name} 的 2025，是拼出来的：白天搞钱、深夜复盘，连做梦都在开会。这一年你没白忙，每一步都算数。2026，继续火力全开——但也记得给快乐留个座位。",
    stats:[[88,99],[55,80],[30,55]] },
  lifer:{ keyword:"热辣滚烫", tag:"2025 年度 · 人间值得",
    summary:"{name} 的 2025，是吃出来的幸福：奶茶续命、朋友作伴，快乐一天都没缺席。别人内卷你干饭，别人焦虑你睡觉。2026，愿你的快乐继续滚烫，烦恼全部过期。",
    stats:[[40,65],[88,99],[75,95]] },
  dreamer:{ keyword:"追光而行", tag:"2025 年度 · 造梦者",
    summary:"{name} 的 2025，脑子里装着星辰大海：想法一个比一个大胆，行动力也在悄悄跟上。世界很大，你偏要去看看。2026，愿你把每一个大胆的想法，都活成现实。",
    stats:[[60,85],[65,90],[55,80]] },
  balancer:{ keyword:"稳中求进", tag:"2025 年度 · 松弛大师",
    summary:"{name} 的 2025，稳得让人羡慕：该卷的时候卷，该躺的时候躺，节奏感直接拉满。不内耗、不硬撑，是成年人最后的体面。2026，愿你继续稳稳的、慢慢的，幸福的。",
    stats:[[55,75],[75,92],[85,99]] },
};

const FUN_LINES = [
  n => `全年共 emo ${n(120,200)} 次，但每次都满血复活 💪`,
  n => `深夜下单 ${n(30,80)} 次，快乐都是包邮到家的 📦`,
  n => `立下的 flag 倒了 ${n(5,15)} 个，但梦想还在续费 🚩`,
  n => `把“明天开始”说了 ${n(100,300)} 遍，明天永远值得期待 🌅`,
  n => `为朋友两肋插刀 ${n(3,10)} 次，义气值直接拉满 🤝`,
  n => `喝了 ${n(50,150)} 杯奶茶，甜蜜负担也是负担 🧋`,
];

/* ============ 流程 ============ */
let answers = [];
let qi = 0;

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function startQuiz(){ answers=[]; qi=0; renderQ(); show('screen-quiz'); }
function renderQ(){
  const Q = QUESTIONS[qi];
  document.getElementById('q-index').textContent = `第 ${qi+1} / ${QUESTIONS.length} 题`;
  document.getElementById('q-title').textContent = Q.q;
  document.getElementById('pbar').style.width = (qi/QUESTIONS.length*100)+'%';
  const box = document.getElementById('opts'); box.innerHTML='';
  // 选项顺序打乱，增加趣味性
  const order = Q.opts.map((_,i)=>i).sort(()=>Math.random()-.5);
  order.forEach(i=>{
    const o = Q.opts[i];
    const b = document.createElement('button');
    b.className='opt'; b.innerHTML = `<span class="e">${o.e}</span><span>${o.t}</span>`;
    b.onclick = ()=>{
      b.classList.add('picked');
      answers.push(o.type);
      setTimeout(()=>{
        qi++;
        if(qi<QUESTIONS.length){ renderQ(); } else {
          document.getElementById('pbar').style.width='100%';
          show('screen-name');
          setTimeout(()=>document.getElementById('name-input').focus(),400);
        }
      },280);
    };
    box.appendChild(b);
  });
}

/* ============ 结果生成 ============ */
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function pickType(){
  const cnt={fighter:0,lifer:0,dreamer:0,balancer:0};
  answers.forEach(t=>cnt[t]++);
  const order=['fighter','lifer','dreamer','balancer'];
  let best=order[0], bestN=-1;
  order.forEach(t=>{ if(cnt[t]>bestN){bestN=cnt[t];best=t;} });
  // 平票：以后面的题（Q5 意愿）优先，再以 Q1 兜底
  const tied = order.filter(t=>cnt[t]===bestN);
  if(tied.length>1){
    if(tied.includes(answers[4])) return answers[4];
    if(tied.includes(answers[0])) return answers[0];
  }
  return best;
}
function esc(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function genResult(skip){
  let name = skip ? '' : document.getElementById('name-input').value.trim();
  if(!name) name='我';
  name = name.slice(0,8);
  const type = pickType();
  const A = ARCHETYPES[type];
  const rnd = mulberry32(hashStr(name+answers.join(',')));
  const R=(a,b)=>Math.round(a+rnd()*(b-a));

  document.getElementById('rc-title').textContent = `${name} 的 2025 年度总结`;
  document.getElementById('rc-keyword').textContent = `「${A.keyword}」`;
  document.getElementById('rc-tag').textContent = A.tag;
  document.getElementById('rc-summary').textContent = A.summary.replace('{name}', name==='我'?'你':name);
  const vals = A.stats.map(([a,b])=>R(a,b));
  ['b0','b1','b2'].forEach((id,i)=>{ document.getElementById(id).style.width='0'; });
  ['v0','v1','v2'].forEach((id,i)=>{ document.getElementById(id).textContent=vals[i]; });
  document.getElementById('rc-fun').textContent = FUN_LINES[Math.floor(rnd()*FUN_LINES.length)](R);

  show('screen-result');
  requestAnimationFrame(()=>setTimeout(()=>{
    ['b0','b1','b2'].forEach((id,i)=>{ document.getElementById(id).style.width=vals[i]+'%'; });
  },150));

  makeQR();
  fireConfetti();
}

/* ============ 二维码（指向本页，朋友扫码也能测） ============ */
function makeQR(){
  const box=document.getElementById('qr-box'); box.innerHTML='';
  const url=location.href.split('#')[0];
  document.getElementById('qr-link').textContent=url.replace(/^https?:\/\//,'');
  try{
    const qr=qrcode(0,'M'); qr.addData(url); qr.make();
    box.innerHTML=qr.createImgTag(4,6);
  }catch(e){
    box.innerHTML='<div style="font-size:12px;color:#a39a8b;text-align:center;padding:8px">复制链接<br>分享给朋友</div>';
  }
}

/* ============ 保存海报 ============ */
function savePoster(){
  toast('海报生成中…');
  const card=document.getElementById('result-card');
  try{
    html2canvas(card,{scale:2,backgroundColor:'#fffdf7',useCORS:true}).then(canvas=>{
      document.getElementById('save-img').src=canvas.toDataURL('image/png');
      document.getElementById('save-overlay').classList.add('show');
    }).catch(()=>toast('生成失败，截图分享吧 📸'));
  }catch(e){ toast('生成失败，截图分享吧 📸'); }
}
function closeSave(){ document.getElementById('save-overlay').classList.remove('show'); }
function restart(){
  document.getElementById('name-input').value='';
  startQuiz();
}
let toastT=null;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';

/* ============ 小彩带 ============ */
function fireConfetti(){
  const c=document.getElementById('confetti'), x=c.getContext('2d');
  c.width=innerWidth; c.height=innerHeight;
  const colors=['#e8622c','#f0a04b','#ffd166','#7fb069','#5e8bff','#c084fc'];
  const P=[]; for(let i=0;i<90;i++) P.push({
    x:Math.random()*c.width, y:-20-Math.random()*c.height*.3,
    w:6+Math.random()*6, h:8+Math.random()*8,
    vy:2+Math.random()*3.5, vx:-1.5+Math.random()*3,
    r:Math.random()*Math.PI, vr:-.1+Math.random()*.2,
    col:colors[i%colors.length]
  });
  let frames=0;
  (function tick(){
    x.clearRect(0,0,c.width,c.height); frames++;
    P.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r);
      x.fillStyle=p.col; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore();
    });
    if(frames<150) requestAnimationFrame(tick); else x.clearRect(0,0,c.width,c.height);
  })();
}
